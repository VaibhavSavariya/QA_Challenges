name: Selenium CI

on:
  push:
    branches:
      - vaibhav

  workflow_dispatch:
    inputs:
      test_suite:
        description: Select the Cucumber test suite
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - sanity

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Run Selected Test Suite
        shell: bash
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"

          if [ -z "$SUITE" ]; then
            SUITE="regression"
          fi

          echo "Running test suite: $SUITE"

          mvn clean test \
            -Dheadless=true \
            "-Dcucumber.filter.tags=@$SUITE"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            test-output